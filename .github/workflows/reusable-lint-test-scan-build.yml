name: reusable-lint-test-scan-build

on:
  workflow_call:
    inputs:
      node-version:
        description: "Version de Node.js utilisée pour lint/test"
        type: string
        default: "20"
      working-directory:
        description: "Dossier du service (utile en cas de monorepo)"
        type: string
        default: "."
      image-name:
        description: "Nom du service, utilisé comme nom d'image dans Artifact Registry (ex. collector-catalog-api)"
        type: string
        required: true
      gcp-project-id:
        description: "Projet GCP hébergeant Artifact Registry"
        type: string
        default: ""
      gcp-region:
        description: "Région Artifact Registry"
        type: string
        default: "europe-west1"
      artifact-repository:
        description: "Dépôt Docker dans Artifact Registry"
        type: string
        default: "collector"
      workload-identity-provider:
        description: "Ressource du provider Workload Identity Federation"
        type: string
        default: ""
      service-account:
        description: "Compte de service GCP utilisé par la CI pour pousser les images"
        type: string
        default: ""
      dockerfile:
        description: "Chemin du Dockerfile relatif au working-directory"
        type: string
        default: "Dockerfile"
      severity-threshold:
        description: "Sévérités Trivy qui font échouer le pipeline"
        type: string
        default: "CRITICAL,HIGH"
      push-image:
        description: "Publier l'image sur Artifact Registry après scan (effectif uniquement sur push vers main, tag staging)"
        type: boolean
        default: false
      build-args:
        description: "Arguments de build Docker, un par ligne (ex. VITE_API_URL=https://api.localhost:8443)"
        type: string
        default: ""

jobs:
  lint-test:
    name: Lint + tests unitaires + couverture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Tests unitaires + couverture
        run: npm test --if-present -- --coverage

      - name: Audit des dépendances (npm audit)
        # --omit=dev : les vulnérabilités des outils de build/dev (ex. @nestjs/cli) ne sont jamais expédiées en production
        run: npm audit --omit=dev --audit-level=high

      - name: Nom d'artifact sécurisé
        id: artifact-name
        if: always()
        run: echo "name=coverage-$(printf '%s' '${{ inputs.image-name }}' | tr -c 'a-zA-Z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.working-directory }}/coverage
          if-no-files-found: ignore

  build-scan:
    name: Build image Docker + scan Trivy + publication Artifact Registry
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH: ${{ inputs.push-image && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ${{ inputs.gcp-region }}-docker.pkg.dev/${{ inputs.gcp-project-id }}/${{ inputs.artifact-repository }}/${{ inputs.image-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image Docker (amd64, chargée localement pour le scan)
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          ARGS=()
          while IFS= read -r arg; do
            if [ -n "$arg" ]; then ARGS+=(--build-arg "$arg"); fi
          done <<< "$BUILD_ARGS"
          docker buildx build \
            "${ARGS[@]}" \
            --platform linux/amd64 \
            --load \
            --cache-to type=gha,mode=max \
            -f "${{ inputs.working-directory }}/${{ inputs.dockerfile }}" \
            -t "$IMAGE:${{ github.sha }}" \
            "${{ inputs.working-directory }}"

      - name: Scan vulnérabilités (Trivy) sur l'image locale
        # tags sans préfixe "v" (ex. 0.24.0, 0.36.0) n'existent plus depuis la migration de trivy-action vers les tags "vX.Y.Z"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: ${{ inputs.severity-threshold }}
          exit-code: "1"
          ignore-unfixed: true

      - name: Authentification GCP (Workload Identity Federation)
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: Configurer l'accès Docker à Artifact Registry
        if: env.PUBLISH == 'true'
        run: gcloud auth configure-docker "${{ inputs.gcp-region }}-docker.pkg.dev" --quiet

      - name: Configurer QEMU (émulation arm64)
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Publier l'image multi-architecture (amd64, arm64) après scan réussi
        if: env.PUBLISH == 'true'
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          ARGS=()
          while IFS= read -r arg; do
            if [ -n "$arg" ]; then ARGS+=(--build-arg "$arg"); fi
          done <<< "$BUILD_ARGS"
          docker buildx build \
            "${ARGS[@]}" \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            -f "${{ inputs.working-directory }}/${{ inputs.dockerfile }}" \
            -t "$IMAGE:${{ github.sha }}" \
            --push \
            "${{ inputs.working-directory }}"

      - name: Tag staging
        if: env.PUBLISH == 'true'
        run: gcloud artifacts docker tags add "$IMAGE:${{ github.sha }}" "$IMAGE:staging"
