name: collector-service
replicaCount: 1

# Secrets de pull (ex. ghcr-pull) pour les images privées
imagePullSecrets: []

image:
  repository: collector/service
  tag: local
  pullPolicy: Never

# 0 = pas de Service ni d'Ingress (worker)
port: 0

env: {}

ingress:
  enabled: false
  host: service.collector.local
  clusterIssuer: collector-selfsigned

resources: {}
